server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://db:5432/locket_clone_db
    username: locket_clone_user
    password: locket_clone_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  docker:
    compose:
      enabled: false
